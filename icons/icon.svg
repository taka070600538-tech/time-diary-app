<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 時間管理ダイアリー アプリアイコン: 時計 + 日記帳 + タイムラインの線(signature) -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#F6F3EC" />

  <!-- 日記帳(ノート) -->
  <rect x="106" y="286" width="300" height="176" rx="22" fill="#2C4A63" />
  <rect x="106" y="286" width="300" height="176" rx="22" fill="none" stroke="#1D3345" stroke-width="4" />
  <line x1="146" y1="404" x2="366" y2="404" stroke="#F6F3EC" stroke-width="8" stroke-linecap="round" opacity="0.55" />
  <line x1="146" y1="430" x2="326" y2="430" stroke="#F6F3EC" stroke-width="8" stroke-linecap="round" opacity="0.55" />

  <!-- タイムラインの帯(signature): 1日を貫く一本の線と丸ノード -->
  <line x1="256" y1="300" x2="256" y2="452" stroke="#B3542E" stroke-width="9" stroke-linecap="round" />
  <circle cx="256" cy="330" r="15" fill="#F6F3EC" stroke="#B3542E" stroke-width="7" />
  <circle cx="256" cy="382" r="15" fill="#F6F3EC" stroke="#B3542E" stroke-width="7" />
  <circle cx="256" cy="434" r="15" fill="#F6F3EC" stroke="#B3542E" stroke-width="7" />

  <!-- 時計 -->
  <circle cx="256" cy="192" r="122" fill="#FFFFFF" stroke="#2C4A63" stroke-width="18" />
  <line x1="256" y1="82" x2="256" y2="100" stroke="#2C4A63" stroke-width="11" stroke-linecap="round" />
  <line x1="378" y1="192" x2="360" y2="192" stroke="#2C4A63" stroke-width="11" stroke-linecap="round" />
  <line x1="256" y1="302" x2="256" y2="284" stroke="#2C4A63" stroke-width="11" stroke-linecap="round" />
  <line x1="134" y1="192" x2="152" y2="192" stroke="#2C4A63" stroke-width="11" stroke-linecap="round" />
  <line x1="256" y1="192" x2="204" y2="160" stroke="#1D3345" stroke-width="16" stroke-linecap="round" />
  <line x1="256" y1="192" x2="338" y2="143" stroke="#1D3345" stroke-width="12" stroke-linecap="round" />
  <circle cx="256" cy="192" r="13" fill="#1D3345" />
</svg>
